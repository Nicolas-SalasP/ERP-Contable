name: CI/CD ERP Contable

on:
  push:
    branches: [main, dev]

jobs:
  # ══════════════════════════════════════════════
  # JOB 1A — TESTS BACKEND (SQLite, rápido)
  # ══════════════════════════════════════════════
  test-backend-sqlite:
    name: 🧪 Tests Backend (SQLite)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, pdo_mysql, mbstring, json, bcmath, intl, gd, zip
          tools: composer:v2

      - name: 📦 Instalar dependencias backend
        working-directory: Backend-laravel
        run: composer install --no-interaction --prefer-dist

      - name: 🔧 Preparar .env de test
        working-directory: Backend-laravel
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: ⚙️ Instalar OpenSSL dev
        run: sudo apt-get update -qq && sudo apt-get install -y openssl libssl-dev

      - name: 🔧 Configurar OPENSSL_CONF
        run: echo "OPENSSL_CONF=/etc/ssl/openssl.cnf" >> $GITHUB_ENV

      - name: Auditar dependencias PHP
        working-directory: Backend-laravel
        run: composer audit --format=plain
        continue-on-error: true

      - name: 🧪 Correr tests (SQLite)
        working-directory: Backend-laravel
        run: php artisan test --stop-on-failure

  # ══════════════════════════════════════════════
  # JOB 1B — TESTS BACKEND (MySQL, valida prod)
  # ══════════════════════════════════════════════
  test-backend-mysql:
    name: 🧪 Tests Backend (MySQL)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: erp_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, mbstring, json, bcmath, intl, gd, zip
          tools: composer:v2

      - name: 📦 Instalar dependencias backend
        working-directory: Backend-laravel
        run: composer install --no-interaction --prefer-dist

      - name: 🔧 Preparar .env MySQL
        working-directory: Backend-laravel
        run: |
          cp .env.example .env
          sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=mysql/' .env
          sed -i 's/DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/DB_PORT=.*/DB_PORT=3306/' .env
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=erp_testing/' .env
          sed -i 's/DB_USERNAME=.*/DB_USERNAME=root/' .env
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=root/' .env
          php artisan key:generate

      - name: ⚙️ Instalar OpenSSL dev
        run: sudo apt-get update -qq && sudo apt-get install -y openssl libssl-dev

      - name: 🔧 Configurar OPENSSL_CONF
        run: echo "OPENSSL_CONF=/etc/ssl/openssl.cnf" >> $GITHUB_ENV

      - name: ⏳ Esperar MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -uroot -proot --silent; then
              echo "MySQL listo"
              break
            fi
            sleep 2
          done

      - name: Auditar dependencias PHP
        working-directory: Backend-laravel
        run: composer audit --format=plain
        continue-on-error: true

      - name: 🧪 Correr tests (MySQL)
        working-directory: Backend-laravel
        run: php artisan test --stop-on-failure

  # ══════════════════════════════════════════════
  # JOB 1C — ANÁLISIS ESTÁTICO (PHPStan / Larastan)
  # ══════════════════════════════════════════════
  static-analysis:
    name: 🔍 Análisis estático (PHPStan)
    runs-on: ubuntu-latest
    continue-on-error: true  # informativo — no bloquea deploy mientras se reduce la deuda

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, pdo_mysql, mbstring, json, bcmath, intl, gd, zip
          coverage: none
          tools: composer:v2

      - name: 📦 Cachear Composer
        uses: actions/cache@v4
        with:
          path: Backend-laravel/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('Backend-laravel/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: 📦 Instalar dependencias
        working-directory: Backend-laravel
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: 🔍 Análisis estático
        working-directory: Backend-laravel
        run: composer stan

  # ══════════════════════════════════════════════
  # JOB 2 — LINT + BUILD FRONTEND
  # ══════════════════════════════════════════════
  test-frontend:
    name: 🧪 Tests Frontend
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: './pnpm-lock.yaml'

      - name: 📦 Instalar dependencias frontend
        run: pnpm install --frozen-lockfile

      - name: 🧪 Lint
        working-directory: Frontend
        run: pnpm run lint

      - name: 🧪 Tests
        working-directory: Frontend
        run: pnpm run test --coverage --run

      - name: Auditar dependencias Node
        working-directory: Frontend
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: 🏗️ Build (verifica que compila)
        working-directory: Frontend
        env:
          VITE_API_URL: https://erp.tenri.cl/api
        run: pnpm run build

  # ══════════════════════════════════════════════
  # JOB 3 — DEPLOY STAGING (solo rama staging)
  # ══════════════════════════════════════════════
  deploy-staging:
    name: 🚀 Deploy Staging
    runs-on: ubuntu-latest
    needs: [test-backend-sqlite, test-backend-mysql, test-frontend]
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    environment:
      name: staging
      url: https://staging.erp.tenri.cl

    # SECRETS REQUERIDOS (configurar en GitHub → Settings → Environments → staging):
    #   FTP_SERVER_STAGING, FTP_USERNAME_STAGING, FTP_PASSWORD_STAGING
    #   SSH_HOST_STAGING, SSH_USERNAME_STAGING, SSH_PRIVATE_KEY_STAGING

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      # ── Frontend ──
      - name: ⚙️ Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: './pnpm-lock.yaml'

      - name: 📦 Instalar dependencias frontend
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build frontend (staging)
        working-directory: Frontend
        env:
          VITE_API_URL: https://staging.erp.tenri.cl/api
        run: pnpm run build

      - name: 🚀 Subir frontend a staging public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER_STAGING }}
          username: ${{ secrets.FTP_USERNAME_STAGING }}
          password: ${{ secrets.FTP_PASSWORD_STAGING }}
          local-dir: ./Frontend/dist/
          server-dir: /public_html/
          dangerous-clean-slate: false

      # ── Backend ──
      - name: ⚙️ Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, mbstring, json, bcmath, intl, gd, zip
          tools: composer:v2

      - name: 📦 Instalar dependencias backend
        working-directory: Backend-laravel
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: 🗜️ Comprimir backend
        run: |
          cd Backend-laravel
          zip -r ../backend.zip . \
            -x "*.git*" \
            -x "tests/*" \
            -x "node_modules/*" \
            -x ".env*" \
            -x "storage/logs/*" \
            -x "storage/framework/cache/*" \
            -x "storage/framework/sessions/*" \
            -x "storage/framework/views/*"

      - name: 🚀 Subir backend comprimido a staging
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER_STAGING }}
          username: ${{ secrets.FTP_USERNAME_STAGING }}
          password: ${{ secrets.FTP_PASSWORD_STAGING }}
          local-dir: ./
          server-dir: /
          exclude: |
            **/*
            !backend.zip

      # ── Servidor staging ──
      - name: 🛠️ Descomprimir y configurar Laravel (staging)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST_STAGING }}
          username: ${{ secrets.SSH_USERNAME_STAGING }}
          key: ${{ secrets.SSH_PRIVATE_KEY_STAGING }}
          port: 22
          script: |
            set -e

            FTP_ROOT=~/domains/staging.erp.tenri.cl
            LARAVEL_ROOT=~/erp_backend_staging
            ERP_PUBLIC=~/domains/staging.erp.tenri.cl/public_html

            if [ -f "$FTP_ROOT/backend.zip" ]; then
              mv "$FTP_ROOT/backend.zip" "$LARAVEL_ROOT/backend.zip"
            fi

            cd $LARAVEL_ROOT
            unzip -o backend.zip
            rm backend.zip

            chmod -R 775 storage bootstrap/cache
            mkdir -p storage/framework/sessions
            mkdir -p storage/framework/views
            mkdir -p storage/framework/cache
            mkdir -p storage/logs

            cp public/index.php  $ERP_PUBLIC/index.php
            cp public/favicon.ico $ERP_PUBLIC/favicon.ico 2>/dev/null || true
            cp public/robots.txt  $ERP_PUBLIC/robots.txt  2>/dev/null || true

            rm -f bootstrap/cache/config.php
            rm -f bootstrap/cache/routes-v7.php

            php artisan optimize:clear
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache
            php artisan storage:link --force 2>/dev/null || true

            echo "✅ Deploy ERP staging completado"

  # ══════════════════════════════════════════════
  # JOB 3B — SMOKE TESTS STAGING (post-deploy)
  # ══════════════════════════════════════════════
  smoke-staging:
    name: 🔥 Smoke Tests Staging
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: './pnpm-lock.yaml'

      - name: 📦 Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: 🔍 Verificar disponibilidad staging
        id: staging-check
        run: |
          if curl -sf --max-time 10 https://staging.erp.tenri.cl/ -o /dev/null 2>&1; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "⚠️ Staging no disponible — omitiendo smoke tests"
          fi

      - name: 🎭 Instalar Chromium
        if: steps.staging-check.outputs.available == 'true'
        working-directory: Frontend
        run: pnpm e2e:install

      - name: 🔥 Smoke tests contra staging
        if: steps.staging-check.outputs.available == 'true'
        working-directory: Frontend
        env:
          E2E_BASE_URL: https://staging.erp.tenri.cl
          CI: true
        run: pnpm e2e:smoke

      - name: 📊 Subir reporte Playwright
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-staging
          path: Frontend/playwright-report/
          retention-days: 7

  # ══════════════════════════════════════════════
  # JOB 4 — DEPLOY PRODUCCIÓN (solo main + todos los tests OK)
  # ══════════════════════════════════════════════
  deploy:
    name: 🚀 Deploy Producción
    runs-on: ubuntu-latest
    needs: [test-backend-sqlite, test-backend-mysql, test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://erp.tenri.cl

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      # ── Frontend ──
      - name: ⚙️ Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: './pnpm-lock.yaml'

      - name: 📦 Instalar dependencias frontend
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build frontend
        working-directory: Frontend
        env:
          VITE_API_URL: https://erp.tenri.cl/api
        run: pnpm run build

      - name: 🚀 Subir frontend via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "Frontend/dist/*"
          target: /home/atlasdig/domains/erp.tenri.cl/public_html/
          strip_components: 2

      # ── Backend ──
      - name: ⚙️ Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, mbstring, json, bcmath, intl, gd, zip
          tools: composer:v2

      - name: 📦 Instalar dependencias backend
        working-directory: Backend-laravel
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: 🗜️ Comprimir backend
        run: |
          cd Backend-laravel
          zip -r ../backend.zip . \
            -x "*.git*" \
            -x "tests/*" \
            -x "node_modules/*" \
            -x ".env*" \
            -x "storage/logs/*" \
            -x "storage/framework/cache/*" \
            -x "storage/framework/sessions/*" \
            -x "storage/framework/views/*"

      - name: 🚀 Subir backend via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "backend.zip"
          target: /home/atlasdig/domains/erp.tenri.cl/

      # ── Servidor ──
      - name: 🛠️ Descomprimir y configurar Laravel
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e

            LARAVEL_ROOT=~/erp_backend
            ERP_PUBLIC=~/domains/erp.tenri.cl/public_html

            mv ~/domains/erp.tenri.cl/backend.zip $LARAVEL_ROOT/backend.zip

            cd $LARAVEL_ROOT
            unzip -o backend.zip
            rm backend.zip

            chmod -R 775 storage bootstrap/cache
            mkdir -p storage/framework/sessions
            mkdir -p storage/framework/views
            mkdir -p storage/framework/cache
            mkdir -p storage/logs

            cp public/index.php  $ERP_PUBLIC/index.php
            cp public/favicon.ico $ERP_PUBLIC/favicon.ico 2>/dev/null || true
            cp public/robots.txt  $ERP_PUBLIC/robots.txt  2>/dev/null || true

            # Limpiar cache de config antes de arrancar artisan
            rm -f bootstrap/cache/config.php
            rm -f bootstrap/cache/routes-v7.php

            php artisan optimize:clear
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache
            php artisan storage:link --force 2>/dev/null || true
