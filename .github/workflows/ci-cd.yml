name: CI/CD ERP Contable

on:
  push:
    branches: [main, dev]

jobs:
  # ══════════════════════════════════════════════
  # JOB 1A — TESTS BACKEND (SQLite, rápido)
  # ══════════════════════════════════════════════
  test-backend-sqlite:
    name: 🧪 Tests Backend (SQLite)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, pdo_mysql, mbstring, json, bcmath, intl, gd, zip
          tools: composer:v2

      - name: 📦 Instalar dependencias backend
        working-directory: Backend-laravel
        run: composer install --no-interaction --prefer-dist

      - name: 🔧 Preparar .env de test
        working-directory: Backend-laravel
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: ⚙️ Instalar OpenSSL dev
        run: sudo apt-get update -qq && sudo apt-get install -y openssl libssl-dev

      - name: 🔧 Configurar OPENSSL_CONF
        run: echo "OPENSSL_CONF=/etc/ssl/openssl.cnf" >> $GITHUB_ENV

      - name: Auditar dependencias PHP
        working-directory: Backend-laravel
        run: composer audit --format=plain
        continue-on-error: true

      - name: 🧪 Correr tests (SQLite)
        working-directory: Backend-laravel
        run: php artisan test --stop-on-failure

  # ══════════════════════════════════════════════
  # JOB 1B — TESTS BACKEND (MySQL, valida prod)
  # ══════════════════════════════════════════════
  test-backend-mysql:
    name: 🧪 Tests Backend (MySQL)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: erp_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, mbstring, json, bcmath, intl, gd, zip
          tools: composer:v2

      - name: 📦 Instalar dependencias backend
        working-directory: Backend-laravel
        run: composer install --no-interaction --prefer-dist

      - name: 🔧 Preparar .env MySQL
        working-directory: Backend-laravel
        run: |
          cp .env.example .env
          sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=mysql/' .env
          sed -i 's/DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/DB_PORT=.*/DB_PORT=3306/' .env
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=erp_testing/' .env
          sed -i 's/DB_USERNAME=.*/DB_USERNAME=root/' .env
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=root/' .env
          php artisan key:generate

      - name: ⚙️ Instalar OpenSSL dev
        run: sudo apt-get update -qq && sudo apt-get install -y openssl libssl-dev

      - name: 🔧 Configurar OPENSSL_CONF
        run: echo "OPENSSL_CONF=/etc/ssl/openssl.cnf" >> $GITHUB_ENV

      - name: ⏳ Esperar MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -uroot -proot --silent; then
              echo "MySQL listo"
              break
            fi
            sleep 2
          done

      - name: Auditar dependencias PHP
        working-directory: Backend-laravel
        run: composer audit --format=plain
        continue-on-error: true

      - name: 🧪 Correr tests (MySQL)
        working-directory: Backend-laravel
        run: php artisan test --stop-on-failure

  # ══════════════════════════════════════════════
  # JOB 1C — ANÁLISIS ESTÁTICO (PHPStan / Larastan)
  # ══════════════════════════════════════════════
  static-analysis:
    name: 🔍 Análisis estático (PHPStan)
    runs-on: ubuntu-latest
    continue-on-error: true  # informativo — no bloquea deploy mientras se reduce la deuda

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, pdo_mysql, mbstring, json, bcmath, intl, gd, zip
          coverage: none
          tools: composer:v2

      - name: 📦 Cachear Composer
        uses: actions/cache@v4
        with:
          path: Backend-laravel/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('Backend-laravel/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: 📦 Instalar dependencias
        working-directory: Backend-laravel
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: 🔍 Análisis estático
        working-directory: Backend-laravel
        run: composer stan

  # ══════════════════════════════════════════════
  # JOB 2 — LINT + BUILD FRONTEND
  # ══════════════════════════════════════════════
  test-frontend:
    name: 🧪 Tests Frontend
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: './pnpm-lock.yaml'

      - name: 📦 Instalar dependencias frontend
        run: pnpm install --frozen-lockfile

      - name: 🧪 Lint
        working-directory: Frontend
        run: pnpm run lint

      - name: 🧪 Tests
        working-directory: Frontend
        run: pnpm run test --coverage --run

      - name: Auditar dependencias Node
        working-directory: Frontend
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: 🏗️ Build (verifica que compila)
        working-directory: Frontend
        env:
          VITE_API_URL: https://erp.tenri.cl/api
        run: pnpm run build

  # ══════════════════════════════════════════════
  # JOB 2A — E2E SMOKE (flujos existentes, backend+frontend levantados en el runner)
  # ══════════════════════════════════════════════
  # No depende de un deploy a staging: levanta backend (sqlite file-based) + frontend (via
  # webServer de Playwright) directo en el runner, igual que global-setup.js hace en local.
  e2e-smoke:
    name: 🎭 E2E Smoke
    runs-on: ubuntu-latest
    needs: [test-backend-sqlite, test-frontend]

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, mbstring, json, bcmath, intl, gd, zip
          tools: composer:v2

      - name: 📦 Instalar dependencias backend
        working-directory: Backend-laravel
        run: composer install --no-interaction --prefer-dist

      - name: 🔧 Preparar .env (sqlite persistente, no en memoria)
        working-directory: Backend-laravel
        run: |
          cp .env.example .env
          sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          sed -i 's#DB_DATABASE=.*#DB_DATABASE=${{ github.workspace }}/Backend-laravel/database/database.sqlite#' .env
          touch database/database.sqlite
          php artisan key:generate
          # CIPHERSWEET_KEY vacia en .env.example -> "Invalid key size" al primer campo cifrado
          # (Cliente.rut) que toque el seeder. Misma key de prueba que phpunit.xml, no es secreto real.
          sed -i 's/CIPHERSWEET_KEY=.*/CIPHERSWEET_KEY=c9c7b3652d3375952a5f7c845f001f11c1271d3d633741562b543dad136d368e/' .env
          # .env.example trae APP_ENV=production a proposito (deploy accidental sin configurar
          # queda seguro), pero aqui bloquea tenri:e2e-setup (guard app()->isProduction()).
          sed -i 's/APP_ENV=.*/APP_ENV=local/' .env

      - name: ⚙️ Instalar OpenSSL dev
        run: sudo apt-get update -qq && sudo apt-get install -y openssl libssl-dev

      - name: 🔧 Configurar OPENSSL_CONF
        run: echo "OPENSSL_CONF=/etc/ssl/openssl.cnf" >> $GITHUB_ENV

      - name: 🌱 Migrar y sembrar datos base
        working-directory: Backend-laravel
        run: php artisan migrate --seed --force

      - name: 👤 Crear usuario/cliente/cuenta bancaria E2E
        working-directory: Backend-laravel
        run: php artisan tenri:e2e-setup

      - name: 🚀 Levantar backend en background (puerto 8001)
        working-directory: Backend-laravel
        run: nohup php artisan serve --port=8001 > storage/logs/serve-e2e.log 2>&1 &

      - name: ⏳ Esperar backend disponible
        run: |
          for i in {1..30}; do
            curl -sf http://localhost:8001/api/health -o /dev/null && { echo "Backend listo"; exit 0; }
            sleep 1
          done
          echo "Backend no respondió a tiempo"; exit 1

      - name: ⚙️ Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: './pnpm-lock.yaml'

      - name: 📦 Instalar dependencias frontend
        run: pnpm install --frozen-lockfile

      - name: 🎭 Instalar Chromium
        working-directory: Frontend
        run: pnpm e2e:install

      - name: 🔥 Correr E2E smoke (flujos existentes)
        working-directory: Frontend
        env:
          VITE_API_URL: http://localhost:8001/api
          E2E_API_URL: http://localhost:8001
          E2E_BASE_URL: http://localhost:3000
          CI: true
        run: pnpm e2e:smoke

      - name: 📊 Subir reporte Playwright (smoke)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-smoke
          path: Frontend/playwright-report/
          retention-days: 7

  # ══════════════════════════════════════════════
  # JOB 2B — E2E FLUJO COMPLETO (solo si el smoke pasó)
  # ══════════════════════════════════════════════
  # Ciclo cotización → factura → pago → conciliación → cierre de período, "por partes"
  # (test.describe.serial). Deliberadamente NO corre si e2e-smoke falla: needs lo garantiza.
  e2e-flujo-completo:
    name: 🎭 E2E Flujo Completo (cotización → cierre)
    runs-on: ubuntu-latest
    needs: [e2e-smoke]

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, mbstring, json, bcmath, intl, gd, zip
          tools: composer:v2

      - name: 📦 Instalar dependencias backend
        working-directory: Backend-laravel
        run: composer install --no-interaction --prefer-dist

      - name: 🔧 Preparar .env (sqlite persistente, no en memoria)
        working-directory: Backend-laravel
        run: |
          cp .env.example .env
          sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          sed -i 's#DB_DATABASE=.*#DB_DATABASE=${{ github.workspace }}/Backend-laravel/database/database.sqlite#' .env
          touch database/database.sqlite
          php artisan key:generate
          # CIPHERSWEET_KEY vacia en .env.example -> "Invalid key size" al primer campo cifrado
          # (Cliente.rut) que toque el seeder. Misma key de prueba que phpunit.xml, no es secreto real.
          sed -i 's/CIPHERSWEET_KEY=.*/CIPHERSWEET_KEY=c9c7b3652d3375952a5f7c845f001f11c1271d3d633741562b543dad136d368e/' .env
          # .env.example trae APP_ENV=production a proposito (deploy accidental sin configurar
          # queda seguro), pero aqui bloquea tenri:e2e-setup (guard app()->isProduction()).
          sed -i 's/APP_ENV=.*/APP_ENV=local/' .env

      - name: ⚙️ Instalar OpenSSL dev
        run: sudo apt-get update -qq && sudo apt-get install -y openssl libssl-dev

      - name: 🔧 Configurar OPENSSL_CONF
        run: echo "OPENSSL_CONF=/etc/ssl/openssl.cnf" >> $GITHUB_ENV

      - name: 🌱 Migrar y sembrar datos base
        working-directory: Backend-laravel
        run: php artisan migrate --seed --force

      - name: 👤 Crear usuario/cliente/cuenta bancaria E2E
        working-directory: Backend-laravel
        run: php artisan tenri:e2e-setup

      - name: 🚀 Levantar backend en background (puerto 8001)
        working-directory: Backend-laravel
        run: nohup php artisan serve --port=8001 > storage/logs/serve-e2e.log 2>&1 &

      - name: ⏳ Esperar backend disponible
        run: |
          for i in {1..30}; do
            curl -sf http://localhost:8001/api/health -o /dev/null && { echo "Backend listo"; exit 0; }
            sleep 1
          done
          echo "Backend no respondió a tiempo"; exit 1

      - name: ⚙️ Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: './pnpm-lock.yaml'

      - name: 📦 Instalar dependencias frontend
        run: pnpm install --frozen-lockfile

      - name: 🎭 Instalar Chromium
        working-directory: Frontend
        run: pnpm e2e:install

      - name: 🔗 Correr E2E flujo completo (por partes, serial)
        working-directory: Frontend
        env:
          VITE_API_URL: http://localhost:8001/api
          E2E_API_URL: http://localhost:8001
          E2E_BASE_URL: http://localhost:3000
          CI: true
        run: pnpm exec playwright test --grep @flujo-completo

      - name: 📊 Subir reporte Playwright (flujo completo)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-flujo-completo
          path: Frontend/playwright-report/
          retention-days: 7

  # ══════════════════════════════════════════════
  # JOB 3 — DEPLOY STAGING (solo rama staging)
  # ══════════════════════════════════════════════
  deploy-staging:
    name: 🚀 Deploy Staging
    runs-on: ubuntu-latest
    needs: [test-backend-sqlite, test-backend-mysql, test-frontend]
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    environment:
      name: staging
      url: https://staging.erp.tenri.cl

    # SECRETS REQUERIDOS (configurar en GitHub → Settings → Environments → staging):
    #   FTP_SERVER_STAGING, FTP_USERNAME_STAGING, FTP_PASSWORD_STAGING
    #   SSH_HOST_STAGING, SSH_USERNAME_STAGING, SSH_PRIVATE_KEY_STAGING

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      # ── Frontend ──
      - name: ⚙️ Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: './pnpm-lock.yaml'

      - name: 📦 Instalar dependencias frontend
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build frontend (staging)
        working-directory: Frontend
        env:
          VITE_API_URL: https://staging.erp.tenri.cl/api
        run: pnpm run build

      - name: 🚀 Subir frontend a staging public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER_STAGING }}
          username: ${{ secrets.FTP_USERNAME_STAGING }}
          password: ${{ secrets.FTP_PASSWORD_STAGING }}
          local-dir: ./Frontend/dist/
          server-dir: /public_html/
          dangerous-clean-slate: false

      # ── Backend ──
      - name: ⚙️ Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, mbstring, json, bcmath, intl, gd, zip
          tools: composer:v2

      - name: 📦 Instalar dependencias backend
        working-directory: Backend-laravel
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: 🗜️ Comprimir backend
        run: |
          cd Backend-laravel
          zip -r ../backend.zip . \
            -x "*.git*" \
            -x "tests/*" \
            -x "node_modules/*" \
            -x ".env*" \
            -x "storage/logs/*" \
            -x "storage/framework/cache/*" \
            -x "storage/framework/sessions/*" \
            -x "storage/framework/views/*"

      - name: 🚀 Subir backend comprimido a staging
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER_STAGING }}
          username: ${{ secrets.FTP_USERNAME_STAGING }}
          password: ${{ secrets.FTP_PASSWORD_STAGING }}
          local-dir: ./
          server-dir: /
          exclude: |
            **/*
            !backend.zip

      # ── Servidor staging ──
      # Deploy atomico por releases+symlink (ver docs/deploy-atomico.md):
      # se arma la release nueva aislada, se migra y cachea ADENTRO de esa
      # carpeta, y solo si todo el script termina sin error se hace el swap
      # del symlink. Si algo falla a mitad de camino (unzip cortado, migracion
      # rota), el symlink erp_backend_staging sigue apuntando a la release
      # anterior y el sitio nunca sirve un estado a medias.
      - name: 🛠️ Descomprimir y configurar Laravel (staging, releases+symlink)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST_STAGING }}
          username: ${{ secrets.SSH_USERNAME_STAGING }}
          key: ${{ secrets.SSH_PRIVATE_KEY_STAGING }}
          port: 22
          script: |
            set -e

            DOMAIN_ROOT=~/domains/staging.erp.tenri.cl
            ERP_PUBLIC=$DOMAIN_ROOT/public_html
            APP_LINK=~/erp_backend_staging
            RELEASES_DIR=~/erp_backend_staging_releases
            SHARED=~/erp_backend_staging_shared
            TIMESTAMP=$(date +%Y%m%d%H%M%S)
            NEW_RELEASE=$RELEASES_DIR/$TIMESTAMP
            KEEP_RELEASES=3
            KEEP_BACKUPS=3

            mkdir -p "$RELEASES_DIR" "$SHARED/storage" "$SHARED/backups"

            # ── Preparar shared/ desde el estado actual, si aun no existe (NO destructivo) ──
            # No se renombra la carpeta vieja aqui -- eso queda para el swap final,
            # despues de que TODO lo demas (unzip, migracion, cache) ya tuvo exito.
            # Asi la ventana en la que erp_backend_staging no existe se reduce a un
            # par de comandos al final, no a la duracion completa del script.
            if [ -d "$APP_LINK" ] && [ ! -L "$APP_LINK" ]; then
              echo "🔧 Primer deploy con releases+symlink: preservando estado actual en shared/"
              [ -f "$APP_LINK/.env" ] && [ ! -f "$SHARED/.env" ] && cp -n "$APP_LINK/.env" "$SHARED/.env"
              if [ -d "$APP_LINK/storage" ] && [ -z "$(ls -A "$SHARED/storage" 2>/dev/null)" ]; then
                rsync -a "$APP_LINK/storage/" "$SHARED/storage/"
              fi
            fi

            if [ ! -f "$SHARED/.env" ]; then
              echo "❌ No existe $SHARED/.env -- no se puede continuar sin config de staging."
              echo "   Copialo manualmente a $SHARED/.env antes del proximo deploy."
              exit 1
            fi

            # ── Preparar release nueva (aislada, el sitio en vivo no la ve todavia) ──
            mkdir -p "$NEW_RELEASE"
            if [ -f "$DOMAIN_ROOT/backend.zip" ]; then
              mv "$DOMAIN_ROOT/backend.zip" "$NEW_RELEASE/backend.zip"
            fi
            cd "$NEW_RELEASE"
            unzip -q -o backend.zip
            rm -f backend.zip

            rm -rf storage
            ln -s "$SHARED/storage" storage
            ln -sf "$SHARED/.env" .env

            mkdir -p storage/framework/sessions storage/framework/views storage/framework/cache storage/logs
            chmod -R 775 "$SHARED/storage" bootstrap/cache

            rm -f bootstrap/cache/config.php
            rm -f bootstrap/cache/routes-v7.php

            php artisan optimize:clear

            # ── Backup de BD antes de migrar (best-effort, no bloquea el deploy si falta mysqldump) ──
            if command -v mysqldump >/dev/null 2>&1; then
              # process substitution (<(...)) requiere /dev/fd, no disponible en el
              # shell remoto de appleboy/ssh-action -- se usa un archivo temporal.
              DBCFG_FILE=$(mktemp)
              php -r '
                require "vendor/autoload.php";
                $d = Dotenv\Dotenv::createImmutable(getcwd());
                $d->safeLoad();
                foreach (["DB_HOST","DB_PORT","DB_DATABASE","DB_USERNAME","DB_PASSWORD"] as $k) { echo ($_ENV[$k] ?? "")."\n"; }
              ' > "$DBCFG_FILE"
              mapfile -t DBCFG < "$DBCFG_FILE"
              rm -f "$DBCFG_FILE"
              MYSQL_PWD="${DBCFG[4]}" mysqldump -h "${DBCFG[0]}" -P "${DBCFG[1]:-3306}" -u "${DBCFG[3]}" "${DBCFG[2]}" \
                | gzip > "$SHARED/backups/db-$TIMESTAMP.sql.gz" \
                && echo "✅ Backup de BD: $SHARED/backups/db-$TIMESTAMP.sql.gz"
            else
              echo "⚠️ mysqldump no disponible en el servidor -- deploy continua SIN backup previo de BD."
            fi

            php artisan migrate --force
            php artisan db:seed --class="Database\Seeders\EstadoCotizacionSeeder" --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache
            php artisan storage:link --force || echo "⚠️ storage:link fallo -- revisar manualmente, los archivos subidos (logos, PDFs, etc) no se van a servir."

            cp public/index.php  "$ERP_PUBLIC/index.php"
            cp public/favicon.ico "$ERP_PUBLIC/favicon.ico" 2>/dev/null || true
            cp public/robots.txt  "$ERP_PUBLIC/robots.txt"  2>/dev/null || true

            # ── Symlink de storage en el docroot publico real ──
            # $ERP_PUBLIC (public_html) es la carpeta que sirve el navegador -- es
            # DISTINTA de $APP_LINK/public (donde corre storage:link, resuelto via
            # base_path() de Laravel). Sin este symlink, cualquier archivo subido
            # (logo de empresa, PDFs adjuntos, etc) se guarda bien en $SHARED/storage
            # pero el navegador nunca lo puede pedir por URL -- 404 silencioso,
            # aunque el backend (que si usa base_path()/public_path()) lo encuentre
            # bien para cosas como el logo embebido en el PDF de cotizacion.
            ln -sfn "$SHARED/storage/app/public" "$ERP_PUBLIC/storage"

            # ── Swap atomico: recien aqui el sitio en vivo pasa a usar la release nueva ──
            # Si erp_backend_staging todavia es carpeta real (primer deploy con este
            # patron), se renombra justo aqui, inmediatamente antes de crear el
            # symlink -- la ventana sin la carpeta es de estos dos comandos, no de
            # todo el script (asi fallo un incidente real: el rename pasaba al
            # principio y un fallo despues dejaba produccion sin erp_backend).
            if [ -d "$APP_LINK" ] && [ ! -L "$APP_LINK" ]; then
              mv "$APP_LINK" "${APP_LINK}.pre-symlink-backup-$TIMESTAMP"
            fi
            ln -sfn "$NEW_RELEASE" "${APP_LINK}.new"
            mv -Tf "${APP_LINK}.new" "$APP_LINK"

            echo "✅ Deploy ERP staging completado -- release activa: $TIMESTAMP"

            # ── Limpieza: conservar solo las ultimas releases/backups ──
            cd "$RELEASES_DIR" && ls -1t | tail -n +$((KEEP_RELEASES + 1)) | xargs -r -I{} rm -rf -- "{}"
            cd "$SHARED/backups" && ls -1t db-*.sql.gz 2>/dev/null | tail -n +$((KEEP_BACKUPS + 1)) | xargs -r rm --

  # ══════════════════════════════════════════════
  # JOB 3B — SMOKE TESTS STAGING (post-deploy)
  # ══════════════════════════════════════════════
  smoke-staging:
    name: 🔥 Smoke Tests Staging
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: './pnpm-lock.yaml'

      - name: 📦 Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: 🔍 Verificar disponibilidad staging
        id: staging-check
        run: |
          if curl -sf --max-time 10 https://staging.erp.tenri.cl/ -o /dev/null 2>&1; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "⚠️ Staging no disponible — omitiendo smoke tests"
          fi

      - name: 🎭 Instalar Chromium
        if: steps.staging-check.outputs.available == 'true'
        working-directory: Frontend
        run: pnpm e2e:install

      - name: 🔥 Smoke tests contra staging
        if: steps.staging-check.outputs.available == 'true'
        working-directory: Frontend
        env:
          E2E_BASE_URL: https://staging.erp.tenri.cl
          CI: true
        run: pnpm e2e:smoke

      - name: 📊 Subir reporte Playwright
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-staging
          path: Frontend/playwright-report/
          retention-days: 7

  # ══════════════════════════════════════════════
  # JOB 4 — DEPLOY PRODUCCIÓN (solo main + todos los tests OK)
  # ══════════════════════════════════════════════
  deploy:
    name: 🚀 Deploy Producción
    runs-on: ubuntu-latest
    needs: [test-backend-sqlite, test-backend-mysql, test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://erp.tenri.cl

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      # ── Frontend ──
      - name: ⚙️ Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: './pnpm-lock.yaml'

      - name: 📦 Instalar dependencias frontend
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build frontend
        working-directory: Frontend
        env:
          VITE_API_URL: https://erp.tenri.cl/api
        run: pnpm run build

      - name: 🚀 Subir frontend via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "Frontend/dist/*"
          target: /home/atlasdig/domains/erp.tenri.cl/public_html/
          strip_components: 2

      # ── Backend ──
      - name: ⚙️ Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, mbstring, json, bcmath, intl, gd, zip
          tools: composer:v2

      - name: 📦 Instalar dependencias backend
        working-directory: Backend-laravel
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: 🗜️ Comprimir backend
        run: |
          cd Backend-laravel
          zip -r ../backend.zip . \
            -x "*.git*" \
            -x "tests/*" \
            -x "node_modules/*" \
            -x ".env*" \
            -x "storage/logs/*" \
            -x "storage/framework/cache/*" \
            -x "storage/framework/sessions/*" \
            -x "storage/framework/views/*"

      - name: 🚀 Subir backend via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "backend.zip"
          target: /home/atlasdig/domains/erp.tenri.cl/

      # ── Servidor ──
      # Deploy atomico por releases+symlink (ver docs/deploy-atomico.md):
      # se arma la release nueva aislada, se migra y cachea ADENTRO de esa
      # carpeta, y solo si todo el script termina sin error se hace el swap
      # del symlink. Si algo falla a mitad de camino (unzip cortado, migracion
      # rota), el symlink erp_backend sigue apuntando a la release anterior y
      # produccion nunca sirve un estado a medias.
      - name: 🛠️ Descomprimir y configurar Laravel (releases+symlink)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e

            DOMAIN_ROOT=~/domains/erp.tenri.cl
            ERP_PUBLIC=$DOMAIN_ROOT/public_html
            APP_LINK=~/erp_backend
            RELEASES_DIR=~/erp_backend_releases
            SHARED=~/erp_backend_shared
            TIMESTAMP=$(date +%Y%m%d%H%M%S)
            NEW_RELEASE=$RELEASES_DIR/$TIMESTAMP
            KEEP_RELEASES=3
            KEEP_BACKUPS=3

            mkdir -p "$RELEASES_DIR" "$SHARED/storage" "$SHARED/backups"

            # ── Preparar shared/ desde el estado actual, si aun no existe (NO destructivo) ──
            # No se renombra la carpeta vieja aqui -- eso queda para el swap final,
            # despues de que TODO lo demas (unzip, migracion, cache) ya tuvo exito.
            # Asi la ventana en la que erp_backend no existe se reduce a un par de
            # comandos al final, no a la duracion completa del script.
            if [ -d "$APP_LINK" ] && [ ! -L "$APP_LINK" ]; then
              echo "🔧 Primer deploy con releases+symlink: preservando estado actual en shared/"
              [ -f "$APP_LINK/.env" ] && [ ! -f "$SHARED/.env" ] && cp -n "$APP_LINK/.env" "$SHARED/.env"
              if [ -d "$APP_LINK/storage" ] && [ -z "$(ls -A "$SHARED/storage" 2>/dev/null)" ]; then
                rsync -a "$APP_LINK/storage/" "$SHARED/storage/"
              fi
            fi

            if [ ! -f "$SHARED/.env" ]; then
              echo "❌ No existe $SHARED/.env -- no se puede continuar sin config de produccion."
              echo "   Copialo manualmente a $SHARED/.env antes del proximo deploy."
              exit 1
            fi

            # ── Preparar release nueva (aislada, produccion no la ve todavia) ──
            mkdir -p "$NEW_RELEASE"
            mv "$DOMAIN_ROOT/backend.zip" "$NEW_RELEASE/backend.zip"
            cd "$NEW_RELEASE"
            unzip -q -o backend.zip
            rm -f backend.zip

            rm -rf storage
            ln -s "$SHARED/storage" storage
            ln -sf "$SHARED/.env" .env

            mkdir -p storage/framework/sessions storage/framework/views storage/framework/cache storage/logs
            chmod -R 775 "$SHARED/storage" bootstrap/cache

            # Limpiar cache de config antes de arrancar artisan
            rm -f bootstrap/cache/config.php
            rm -f bootstrap/cache/routes-v7.php

            php artisan optimize:clear

            # ── Backup de BD antes de migrar (best-effort, no bloquea el deploy si falta mysqldump) ──
            if command -v mysqldump >/dev/null 2>&1; then
              # process substitution (<(...)) requiere /dev/fd, no disponible en el
              # shell remoto de appleboy/ssh-action -- se usa un archivo temporal.
              DBCFG_FILE=$(mktemp)
              php -r '
                require "vendor/autoload.php";
                $d = Dotenv\Dotenv::createImmutable(getcwd());
                $d->safeLoad();
                foreach (["DB_HOST","DB_PORT","DB_DATABASE","DB_USERNAME","DB_PASSWORD"] as $k) { echo ($_ENV[$k] ?? "")."\n"; }
              ' > "$DBCFG_FILE"
              mapfile -t DBCFG < "$DBCFG_FILE"
              rm -f "$DBCFG_FILE"
              MYSQL_PWD="${DBCFG[4]}" mysqldump -h "${DBCFG[0]}" -P "${DBCFG[1]:-3306}" -u "${DBCFG[3]}" "${DBCFG[2]}" \
                | gzip > "$SHARED/backups/db-$TIMESTAMP.sql.gz" \
                && echo "✅ Backup de BD: $SHARED/backups/db-$TIMESTAMP.sql.gz"
            else
              echo "⚠️ mysqldump no disponible en el servidor -- deploy continua SIN backup previo de BD."
            fi

            php artisan migrate --force
            php artisan db:seed --class="Database\Seeders\EstadoCotizacionSeeder" --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache
            php artisan storage:link --force || echo "⚠️ storage:link fallo -- revisar manualmente, los archivos subidos (logos, PDFs, etc) no se van a servir."

            cp public/index.php  "$ERP_PUBLIC/index.php"
            cp public/favicon.ico "$ERP_PUBLIC/favicon.ico" 2>/dev/null || true
            cp public/robots.txt  "$ERP_PUBLIC/robots.txt"  2>/dev/null || true

            # ── Symlink de storage en el docroot publico real (mismo motivo que en
            # staging: $ERP_PUBLIC es distinto de $APP_LINK/public) ──
            ln -sfn "$SHARED/storage/app/public" "$ERP_PUBLIC/storage"

            # ── Swap atomico: recien aqui produccion pasa a usar la release nueva ──
            # Si erp_backend todavia es carpeta real (primer deploy con este patron),
            # se renombra justo aqui, inmediatamente antes de crear el symlink -- la
            # ventana sin la carpeta es de estos dos comandos, no de todo el script
            # (asi fallo el incidente real del 2026-07-03: el rename pasaba al
            # principio y un fallo despues dejaba produccion sin erp_backend, 500 en
            # toda la API hasta la restauracion manual).
            if [ -d "$APP_LINK" ] && [ ! -L "$APP_LINK" ]; then
              mv "$APP_LINK" "${APP_LINK}.pre-symlink-backup-$TIMESTAMP"
            fi
            ln -sfn "$NEW_RELEASE" "${APP_LINK}.new"
            mv -Tf "${APP_LINK}.new" "$APP_LINK"

            echo "✅ Deploy ERP produccion completado -- release activa: $TIMESTAMP"

            # ── Limpieza: conservar solo las ultimas releases/backups ──
            cd "$RELEASES_DIR" && ls -1t | tail -n +$((KEEP_RELEASES + 1)) | xargs -r -I{} rm -rf -- "{}"
            cd "$SHARED/backups" && ls -1t db-*.sql.gz 2>/dev/null | tail -n +$((KEEP_BACKUPS + 1)) | xargs -r rm --
